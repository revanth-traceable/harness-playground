# Pod and container security contexts.
cd:
  gitops:
    dbInit:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
global:
  waitForInitContainer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
