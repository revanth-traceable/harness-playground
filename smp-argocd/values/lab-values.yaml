# Lab overrides for chart harness 0.46.0: only values that differ from the chart defaults.
# Secret references live in lab-secrets.yaml.
x-pod-security: &pod-security
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
x-container-security: &container-security
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

cd:
  gitops:
    dbInit:
      securityContext: *container-security
    podSecurityContext: *pod-security
    securityContext: *container-security
chaos:
  chaos-k8s-ifs:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 64m
        memory: 128Mi
  chaos-linux-ifc:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 64m
        memory: 128Mi
  chaos-linux-ifs:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 64m
        memory: 128Mi
  chaos-machine-ifc:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 64m
        memory: 128Mi
  chaos-machine-ifs:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 64m
        memory: 128Mi
  chaos-manager:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 128m
        memory: 256Mi
  chaos-web:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 64m
        memory: 128Mi
global:
  autoscaling:
    enabled: false
  cd:
    enabled: true
  chaos:
    enabled: true
  imagePullSecrets:
    - regcred
  ingress:
    hosts:
      - harness.traceablepoc.com
    tls:
      secretName: harness.traceablepoc.com
  istio:
    enableRegexRoutes: true
    enabled: true
    gateway:
      create: false
      name: public
      namespace: istio-system
    hosts:
      - harness.traceablepoc.com
      - istio-ingressgateway.istio-system.svc.cluster.local
    istioGatewayServiceUrl: http://istio-ingressgateway.istio-system.svc.cluster.local
    tls:
      credentialName: harness.traceablepoc.com
    virtualService:
      gateways:
        - istio-system/public
      hosts:
        - harness.traceablepoc.com
        - istio-ingressgateway.istio-system.svc.cluster.local
  loadbalancerURL: https://harness.traceablepoc.com
  ssc:
    enabled: false
  storageClass: gp2
  storageClassName: gp2
  waitForInitContainer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
platform:
  access-control:
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 256m
        memory: 1Gi
    securityContext: *container-security
  audit-event-streaming:
    containerSecurityContext: *container-security
    podSecurityContext: *pod-security
  bootstrap:
    database:
      minio:
        defaultBuckets: logs
        persistence:
          size: 10Gi
      mongodb:
        containerSecurityContext: *container-security
        extraFlags:
          - --wiredTigerCacheSizeGB=0.5
        persistence:
          size: 20Gi
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 1024Mi
      mongodbupgrades:
        mongoFCVUpgrade:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        removeArbiter:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          enabled: false # no arbiter in this replica set; the TTL-deleted Job would keep the app OutOfSync
      postgresql:
        primary:
          persistence:
            size: 8Gi
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi
        volumePermissions:
          enabled: false
      redis:
        initContainers:
          config_init:
            securityContext: *container-security
        podSecurityContext:
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        redis:
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 1
              memory: 256Mi
          securityContext: *container-security
        sentinel:
          securityContext: *container-security
        useAntiAffinity: false
      timescaledb:
        autoscaling:
          enabled: false
        replicaCount: 1
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 0.3
            memory: 512Mi
    networking:
      defaultbackend:
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 32m
            memory: 512Mi
      nginx:
        resources:
          requests:
            cpu: 32m
  change-data-capture:
    containerSecurityContext: *container-security
    java:
      memory: 2048
    podSecurityContext: *pod-security
  delegate-proxy:
    autoscaling:
      enabled: false
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 50Mi
      requests:
        cpu: 50m
        memory: 50Mi
    securityContext: *container-security
  gateway:
    java:
      memory: 768
    podSecurityContext: *pod-security
    replicaCount: 2
    securityContext: *container-security
  harness-db-migrator:
    podSecurityContext: *pod-security
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 65534
  harness-manager:
    featureFlags:
      ADDITIONAL: PL_GCP_OIDC_AUTHENTICATION,PIPE_MULTILINE_VARIABLE_INPUTNEW_FEATURE_FLAGNEW_FEATURE_FLAGNEW_FEATURE_FLAG,PL_AUDIT_LOG_STREAMING_ENABLED,FF1,FF2
      NG: ENABLE_DEFAULT_NG_EXPERIENCE_FOR_ONPREM,NEXT_GEN_ENABLED,NEW_LEFT_NAVBAR_SETTINGS,PL_ENABLE_JIT_USER_PROVISION,CDS_NAV_2_0,PL_HIDE_ACCOUNT_EDITION_UI,PIPE_GITX_KEEP_REPO_NAME_FALLBACK # chart default without SPG_SIDENAV_COLLAPSE
    java:
      memory: "1024"
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 0.5
        memory: 2048Mi
    securityContext: *container-security
  log-service:
    config:
      LOG_SERVICE_DISABLE_AUTH: "false"
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 64m
        memory: 256Mi
    securityContext: *container-security
  looker:
    resources:
      limits:
        memory: 8Gi
      requests:
        memory: 8Gi
  next-gen-ui:
    podSecurityContext: *pod-security
    replicaCount: 2
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 500m
        memory: 256Mi
    securityContext: *container-security
  ng-auth-ui:
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 32m
        memory: 64Mi
    securityContext: *container-security
  ng-custom-dashboards:
    memory: 384
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
  ng-dashboard-aggregator:
    java:
      memory: "1024"
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 64m
        memory: 2048Mi
    securityContext: *container-security
  ng-manager:
    java:
      memory: 1024m
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 256m
        memory: 2048Mi
    securityContext: *container-security
  pipeline-service:
    java:
      memory: 768m
    podSecurityContext: *pod-security
    resources: # also sizes orchestration-engine
      requests:
        cpu: 512m
        memory: 6Gi
      limits:
        memory: 6Gi
    securityContext: *container-security
  platform-service:
    java:
      memory: 1024m
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 1400Mi
      requests:
        cpu: 256m
        memory: 1400Mi
    securityContext: *container-security
  policy-mgmt:
    podSecurityContext: *pod-security
    securityContext: *container-security
  queue-service:
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 250Mi
      requests:
        memory: 250Mi
    securityContext: *container-security
  scm-service:
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 64m
        memory: 256Mi
    securityContext: *container-security
  template-service:
    podSecurityContext: *pod-security
    resources:
      limits:
        memory: 1500Mi
      requests:
        cpu: 256m
        memory: 1500Mi
    securityContext: *container-security
  ui:
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 0.2
        memory: 200Mi
srm:
  cv-nextgen:
    podSecurityContext: *pod-security
    securityContext: *container-security
  le-nextgen:
    podSecurityContext: *pod-security
    securityContext: *container-security
  srm-ui:
    podSecurityContext: *pod-security
    securityContext: *container-security
    virtualService:
      objects:
        - pathMatchType: prefix
          pathRewrite: /
          paths:
            - backend:
                service:
                  name: srm-ui
              path: '{{ .Values.global.istio.virtualService.pathPrefix }}/srmui/'
