global:
  airgap: "false"
  autoscaling:
    enabled: false
  ccm:
    enabled: false
  cd:
    enabled: true
  cdc:
    enabled: true
  cg:
    enabled: false
  chaos:
    enabled: true
  ci:
    enabled: false
  code:
    enabled: false
  commonAnnotations: {}
  commonLabels: {}
  dbops:
    enabled: false
  ff:
    enabled: false
  gatewayAPI:
    create: false
    enabled: false
  ha: true
  iacm:
    enabled: false
  imagePullSecrets:
    - regcred
  imageRegistry: ""
  ingress:
    enabled: false
    hosts:
      - harness.traceablepoc.com
    tls:
      enabled: true
      secretName: harness.traceablepoc.com
  istio:
    enableRegexRoutes: true
    enabled: true
    gateway:
      create: false
      name: public
      namespace: istio-system
      port: 443
      protocol: HTTPS
      selector:
        istio: ingressgateway
    hosts:
      - harness.traceablepoc.com
      - istio-ingressgateway.istio-system.svc.cluster.local
    istioGatewayServiceUrl: http://istio-ingressgateway.istio-system.svc.cluster.local
    strict: false
    tls:
      credentialName: harness.traceablepoc.com
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
    virtualService:
      gateways:
        - istio-system/public
      hosts:
        - harness.traceablepoc.com
        - istio-ingressgateway.istio-system.svc.cluster.local
  license:
    secrets:
      kubernetesSecrets:
        - secretName: harness-license
          keys:
            NG_LICENSE: NG_LICENSE
  loadbalancerURL: https://harness.traceablepoc.com
  srm:
    enabled: false
  ssc:
    enabled: false
  sto:
    enabled: false
  storageClass: gp2
  storageClassName: gp2
  waitForInitContainer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
