# Lab settings on top of the chart's override-demo.yaml (sizing comes from that profile).
# Security contexts: lab-security.yaml. Secret references: lab-secrets.yaml.
global:
  autoscaling:
    enabled: false
  cd:
    enabled: true
  chaos:
    enabled: false
  imagePullSecrets:
    - regcred
  ingress:
    hosts:
      - harness.traceablepoc.com
    tls:
      secretName: harness.traceablepoc.com
  istio:
    enableRegexRoutes: true
    enabled: true
    gateway:
      create: false
      name: public
      namespace: istio-system
    hosts:
      - harness.traceablepoc.com
      - istio-ingressgateway.istio-system.svc.cluster.local
    istioGatewayServiceUrl: http://istio-ingressgateway.istio-system.svc.cluster.local
    tls:
      credentialName: harness.traceablepoc.com
    virtualService:
      gateways:
        - istio-system/public
      hosts:
        - harness.traceablepoc.com
        - istio-ingressgateway.istio-system.svc.cluster.local
  loadbalancerURL: https://harness.traceablepoc.com
  ssc:
    enabled: false
  storageClass: gp2
  storageClassName: gp2
  ci:
    enabled: true
platform:
  bootstrap:
    database:
      mongodbupgrades:
        removeArbiter:
          enabled: false # no arbiter in this replica set; the TTL-deleted Job would keep the app OutOfSync
      postgresql:
        volumePermissions:
          enabled: false
      redis:
        volumeClaimTemplate:
          resources:
            requests:
              storage: 12Gi # grown from 10Gi: PVCs patched, StatefulSet deleted with --cascade=orphan, then synced
  gateway:
    replicaCount: 2
  harness-manager:
    featureFlags:
      ADDITIONAL: PL_GCP_OIDC_AUTHENTICATION,PIPE_MULTILINE_VARIABLE_INPUTNEW_FEATURE_FLAGNEW_FEATURE_FLAGNEW_FEATURE_FLAG,PL_AUDIT_LOG_STREAMING_ENABLED,FF1,FF2
      NG: ENABLE_DEFAULT_NG_EXPERIENCE_FOR_ONPREM,NEXT_GEN_ENABLED,NEW_LEFT_NAVBAR_SETTINGS,PL_ENABLE_JIT_USER_PROVISION,CDS_NAV_2_0,PL_HIDE_ACCOUNT_EDITION_UI,PIPE_GITX_KEEP_REPO_NAME_FALLBACK # chart default without SPG_SIDENAV_COLLAPSE
  log-service:
    config:
      LOG_SERVICE_DISABLE_AUTH: "false"
    s3:
      endpoint: ""
      enableMinioSupport: false
      bucketName: harness-s3-logs
      region: eu-central-1
  next-gen-ui:
    replicaCount: 2
  access-control:
    resources: # demo profile's 768Mi is OOMKilled at start-up; this is the small profile's size
      limits:
        memory: 1536Mi
      requests:
        cpu: 1
        memory: 1536Mi
  pipeline-service:
    resources: # demo profile's 2Gi is OOMKilled; small profile's memory. Also sizes orchestration-engine
      limits:
        memory: 4Gi
      requests:
        cpu: 512m
        memory: 4Gi
