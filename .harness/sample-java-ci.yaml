pipeline:
  name: mvn-java-app-ci
  identifier: mvnjavaappci
  projectIdentifier: revanthcstesting
  orgIdentifier: default
  tags:
    owner: mcp-cursor-agent-smoke-2026-06-03
  properties:
    ci:
      codebase:
        connectorRef: account.revanthplayground
        build: <+input>
  stages:
    - stage:
        name: ci
        identifier: ci
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            override: false
            paths: []
          buildIntelligence:
            enabled: false
          execution:
            steps:
              - step:
                  type: Run
                  name: build
                  identifier: Run_1
                  spec:
                    connectorRef: public
                    image: maven:3.9-eclipse-temurin-11
                    shell: Sh
                    command: |-
                      cd simple-java-app/
                      mvn clean package -DskipTests
                    resources:
                      limits:
                        memory: 100Mi
                        cpu: "0.2"
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          sharedPaths:
            - /root/.m2
